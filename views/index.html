<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>File Metadata Microservice</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 2rem; }
    .box { max-width: 600px; margin: 0 auto; }
    form { margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>File Metadata Microservice</h1>
    <p>Choisis un fichier puis clique sur <strong>Upload</strong>. Le serveur retournera le nom, le type et la taille en bytes.</p>

    <!-- FORMULAIRE REQUIS PAR LES TESTS FCC -->
    <form id="uploadForm" action="/api/fileanalyse" method="post" enctype="multipart/form-data">
      <!-- le name DOIT être exactement "upfile" -->
      <input type="file" name="upfile" required />
      <button type="submit">Upload</button>
    </form>

    <hr/>
    <p>Exemples d'API :</p>
    <ul>
      <li><a href="/api/fileanalyse">POST /api/fileanalyse</a> (via le formulaire ci-dessus)</li>
    </ul>
  </div>
</body>
</html>
